<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장비 단말 — WorkerBadge</title>
<style>
/* 장비에 붙은 작은 화면 역할: 바뀌는 QR + 시동 결과 */
:root{--bg:#12161C;--panel:#1A2029;--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3440;--amber:#F2B624;--ok:#6FD39E;--ok-bg:#16301F;--no:#F08A7E;--no-bg:#3A1C19;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;display:flex;gap:10px;align-items:center}
select,a.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-decoration:none}
select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;padding:24px 20px;max-width:1100px;margin:0 auto;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.qr{background:#fff;border-radius:12px;padding:12px;display:grid;place-items:center;aspect-ratio:1;max-width:340px;margin:0 auto}
.qr svg{width:100%;height:auto;display:block}
.bar{height:6px;border-radius:3px;background:var(--line);margin:14px auto 6px;max-width:340px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 0}
.big{font-size:44px;font-weight:800;line-height:1.15;margin:4px 0 6px}
.state.ok{border-color:var(--ok);background:var(--ok-bg)} .state.ok .big{color:var(--ok)}
.state.no{border-color:var(--no);background:var(--no-bg)} .state.no .big{color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.no{color:var(--no);border-color:var(--no)}
.note{margin-top:12px;font-size:13px;color:var(--amber)}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.eqname{font-size:28px;font-weight:800;margin:0}
.using{display:none;text-align:center;padding:10px 0}
.using .who{font-size:22px;font-weight:800;margin:4px 0}
.using .tm{font:800 46px var(--mono);color:var(--ok);margin:4px 0 12px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.stop{background:var(--no-bg);color:var(--no);border-color:var(--no);font-weight:700}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.net{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.net.on{color:var(--ok);border-color:var(--ok)}
.style{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
#conn{position:fixed;left:0;right:0;bottom:0;background:#B8382C;color:#fff;padding:8px 16px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>🔒 장비 단말 <span style="font-weight:400;font-size:13px;color:var(--muted)">WorkerBadge</span></h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <label style="font-size:13px;color:var(--muted)">장비 <select id="eq" aria-label="장비 선택"></select></label>
    <a class="btn" href="/admin">관리자</a><a class="btn" href="/">통합 화면</a>
  </div>
</header>
<main>
  <section class="card" aria-labelledby="qrh">
    <p class="eqname" id="eqName">-</p>
    <p class="mono" id="eqId" style="margin:0 0 14px"></p>
    <div id="qrBox">
      <div class="qr" id="qr" role="img" aria-label="휴대폰으로 찍을 QR 코드"></div>
      <div class="bar" aria-hidden="true"><i id="bar" style="width:100%"></i></div>
      <p class="hint" id="qrh">휴대폰 카메라로 QR을 찍으세요 · <span id="left">30</span>초마다 바뀌어요</p>
      <p class="hint"><span class="net" id="net"></span></p>
      <p class="hint"><a id="same" href="#" target="_blank" style="color:var(--amber)">휴대폰이 없으면: 이 PC에서 작업자 앱으로 열기</a></p>
    </div>
    <div class="using" id="usingBox" aria-live="polite">
      <p style="margin:0;color:var(--muted)">사용 중</p>
      <div class="who" id="uWho"></div>
      <div class="tm" id="uTm">00:00</div>
      <div class="acts"><button id="uEnd">작업 종료</button><button class="stop" id="uSeat">작업자 이탈 (좌석 센서 모사)</button></div>
      <p class="hint" style="margin-top:10px">한 장비는 한 사람만 — 다른 사람이 인증하면 끝날 때까지 보류돼요</p>
    </div>
    <div class="style"><label>이번 작업 운전 방식 <span style="font-size:11.5px">(휴대폰 센서 기록이 없을 때만 쓰는 시험용 기록 — 휴대폰 센서가 켜져 있으면 실제 기록으로 분석)</span><br>
      <select id="style" style="margin-top:4px"><option value="skilled">숙련자처럼</option><option value="novice">미숙하게</option><option value="risky">위험하게</option></select></label></div>
  </section>
  <section class="card state" id="state" aria-live="polite">
    <p style="margin:0;color:var(--muted);font-size:13px">시동 상태</p>
    <div class="big" id="verdict">🔒 잠김 — 대기 중</div>
    <div id="detail" style="font-size:15px">작업자가 QR을 찍고 휴대폰에서 서명하면, 체인에서 자격을 확인해 바로 시동 여부를 정해요. 발급기관은 매번 끼지 않아요.</div>
    <div class="chips" id="checks"></div>
    <div class="note" id="ainote" hidden></div>
    <p class="mono" id="meta" style="margin-top:14px"></p>
  </section>
</main>
<div id="conn" hidden>⚠ 프로그램 서버와 연결이 끊겼어요 — start.bat 창이 켜져 있는지 확인하세요.</div>
<script src="/vendor/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const params = new URLSearchParams(location.search);
let eq = params.get("eq") || "FL-001", lastNonce = null, lastResultAt = 0, shownUntil = 0, first = true;

let session = null, timer = null;
async function api(p, body) {
  const r = await fetch(p, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
}
const mmss = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
function drawQR(url) {
  const q = qrcode(0, "M"); q.addData(url); q.make();
  $("qr").innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  $("same").href = url;
}
function showUsing() {
  $("qrBox").style.display = session ? "none" : "";
  $("usingBox").style.display = session ? "block" : "none";
  clearInterval(timer);
  if (!session) return;
  $("uWho").textContent = `${session.workerName}`;
  const upd = () => ($("uTm").textContent = mmss(Date.now() - session.startedAt)); upd(); timer = setInterval(upd, 1000);
  if (!shownUntil) { // 다른 결과를 잠깐 보여 주는 중이 아니면 ON 상태 표시
    $("state").className = "card state ok"; $("verdict").textContent = "✅ 시동 ON — 사용 중";
    $("detail").innerHTML = `<b>${esc(session.workerName)}</b> · ${new Date(session.startedAt).toLocaleTimeString("ko-KR")} 시작`;
  }
}
function showEnded(r) {
  const st = $("state");
  st.className = "card state" + (r.ai && r.ai.flagged ? " no" : "");
  $("verdict").textContent = "🏁 운용 종료";
  const BY = { phone: "휴대폰에서 종료", equipment: "장비 화면에서 종료", seat: "작업자 이탈 (좌석 센서)", admin: "관리자가 종료" };
  $("detail").innerHTML = `<b>${esc(r.workerName)}</b> · 운용 시간 ${mmss(r.durationSec * 1000)} · ${BY[r.endedBy] || r.endedBy}`;
  $("checks").innerHTML = ""; $("ainote").hidden = !r.ai;
  if (r.ai) $("ainote").textContent = r.ai.flagged ? `⚠ AI 자동 분석: 재교육 권고 (이상 점수 ${r.ai.anomaly.toFixed(3)}) · ${r.ai.courses.join(", ") || "-"} → 발급기관 확인 대기` : `✅ AI 자동 분석: 정상 범위 (이상 점수 ${r.ai.anomaly.toFixed(3)})`;
  $("meta").textContent = "🔒 시동 잠김 — 새 QR로 다음 작업자를 기다려요";
}
function showResult(r) {
  if (r.ended) return showEnded(r);
  const st = $("state");
  st.className = "card state " + (r.allowed ? "ok" : "no");
  $("verdict").textContent = r.allowed ? "✅ 시동 허용" : r.busy ? "⏳ 보류 — 다른 작업자 사용 중" : "❌ 시동 거부";
  $("detail").innerHTML = `<b>${esc(r.workerName)}</b> — ${esc(r.reason)}`;
  $("checks").innerHTML = (r.checks || []).map((c) => `<span class="chip ${c.ok ? "ok" : "no"}">${c.ok ? "✓" : "✗"} ${esc(c.typeName)}</span>`).join("")
    + (r.face ? `<span class="chip ${r.face.ok && r.face.live ? "ok" : "no"}" title="휴대폰 안에서 확인한 결과 (얼굴 정보는 장비로 오지 않음)">${r.face.ok && r.face.live ? "✓" : "✗"} 얼굴 확인 (휴대폰)</span>` : "");
  $("ainote").hidden = !r.aiPending;
  if (r.aiPending) $("ainote").textContent = `⚠ AI 재교육 권고가 발급기관 확인을 기다리는 중이에요 (${r.aiPending.courses.join(", ") || "숙련도"}) — 시동은 막지 않고 알려만 줘요`;
  $("meta").textContent = `${new Date(r.at).toLocaleTimeString("ko-KR")} · 체인 조회 ${r.lookupMs !== undefined && r.lookupMs !== null ? r.lookupMs.toFixed(1) + "ms, 가스 0" : "-"}${r.worker ? " · " + r.worker : ""}`;
}
function idle() {
  $("state").className = "card state";
  $("verdict").textContent = "🔒 잠김 — 대기 중";
  $("detail").textContent = "작업자가 QR을 찍고 휴대폰에서 서명하면, 체인에서 자격을 확인해 바로 시동 여부를 정해요. 발급기관은 매번 끼지 않아요.";
  $("checks").innerHTML = ""; $("ainote").hidden = true; $("meta").textContent = "";
}
async function tick() {
  try {
    const d = await api(`/api/eq/state?eq=${encodeURIComponent(eq)}`);
    $("conn").hidden = true;
    if (!$("eq").options.length) {
      $("eq").innerHTML = d.equipmentList.map((e) => `<option value="${e.id}">${esc(e.name)} (${e.id})</option>`).join("");
      $("eq").value = eq;
    }
    $("eqName").textContent = d.equipment.name; $("eqId").textContent = `${d.equipment.id} · 가상 블록체인 시각 ${d.chainDate}`;
    document.title = `${d.equipment.name} — 장비 단말`;
    if (d.qr.nonce !== lastNonce) { lastNonce = d.qr.nonce; drawQR(d.qr.url); }
    $("net").className = "net" + (d.internet ? " on" : "");
    $("net").textContent = d.internet ? "🌐 인터넷 주소 — 휴대폰 데이터(LTE·5G)로도 접속" : "📶 같은 와이파이(또는 핫스팟)에서만 접속";
    if (document.activeElement !== $("style")) $("style").value = d.style;
    const was = session && session.id; session = d.session; if ((session && session.id) !== was) showUsing();
    $("qrh").innerHTML = /\/\/localhost/.test(d.qr.url)
      ? '<b style="color:var(--no)">⚠ QR 주소가 localhost 라서 휴대폰이 열 수 없어요.</b> 관리자 화면 → "PC 주소 직접 입력"에서 PC 주소를 넣어 주세요.'
      : `휴대폰 카메라로 QR을 찍으세요 · <span id="left">30</span>초마다 바뀌어요`;
    const left = Math.max(0, Math.ceil(d.qr.rotatesInMs / 1000));
    if ($("left")) $("left").textContent = left; $("bar").style.width = (d.qr.rotatesInMs / 300) + "%";
    if (first) { first = false; lastResultAt = d.last ? d.last.at : 0; } // 화면을 연 뒤에 들어온 결과만 보여 준다
    if (d.last && d.last.at > lastResultAt) { lastResultAt = d.last.at; showResult(d.last); shownUntil = Date.now() + 10000; }
    else if (shownUntil && Date.now() > shownUntil) { shownUntil = 0; session ? showUsing() : idle(); }
  } catch (e) { $("conn").hidden = false; }
}
$("style").onchange = () => api("/api/eq/style", { eq, style: $("style").value }).catch((e) => alert(e.message));
const endBy = (by) => api("/api/session/end", { eq, by }).then(() => tick()).catch((e) => alert(e.message));
$("uEnd").onclick = () => endBy("equipment");
$("uSeat").onclick = () => endBy("seat");
$("eq").onchange = () => { eq = $("eq").value; history.replaceState(null, "", `?eq=${eq}`); lastNonce = null; first = true; idle(); tick(); };
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
